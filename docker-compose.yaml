# The whole recommendation system with one command:
#
#     docker compose up
#
# then open http://localhost:8080.
#
# Every app image is pulled from Docker Hub when it is published there; otherwise compose builds it
# from the develop branch on GitHub (slower: Maven and npm run inside Docker).
# All settings have defaults; to change them, copy env.example to .env.
# The case data goes into ./data (never committed): catalog-service and metric-service import it at startup.
name: recommendation-system

x-java-env: &java-env
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m"

# The JRE image has no curl or wget, so bash talks HTTP to the health endpoint itself.
x-java-healthcheck: &java-healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200'"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 40s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-secret}' --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.1.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  auth-service:
    image: ${DOCKERHUB_USER:-kekishev}/hackathon-recommendation-system-auth-service:${IMAGE_TAG:-latest}
    pull_policy: missing
    build: ${AUTH_SERVICE_BUILD:-https://github.com/Hack-Challenges-recommendation-system/Auth-service.git#develop}
    restart: unless-stopped
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/auth
      DB_USERNAME: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-secret-change-it-for-any-real-deployment-0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *java-healthcheck

  profile-service:
    image: ${DOCKERHUB_USER:-kekishev}/hackathon-recommendation-system-profile-service:${IMAGE_TAG:-latest}
    pull_policy: missing
    build: ${PROFILE_SERVICE_BUILD:-https://github.com/Hack-Challenges-recommendation-system/Profile-service.git#develop}
    restart: unless-stopped
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/profile
      DB_USERNAME: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: *java-healthcheck

  catalog-service:
    image: ${DOCKERHUB_USER:-kekishev}/hackathon-recommendation-system-catalog-service:${IMAGE_TAG:-latest}
    pull_policy: missing
    build: ${CATALOG_SERVICE_BUILD:-https://github.com/Hack-Challenges-recommendation-system/Catalog-service.git#develop}
    restart: unless-stopped
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/catalog
      DB_USERNAME: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      CATALOG_IMPORT_PATH: ${CATALOG_IMPORT_PATH:-file:/data/catalog.json}
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *java-healthcheck

  metric-service:
    image: ${DOCKERHUB_USER:-kekishev}/hackathon-recommendation-system-metric-service:${IMAGE_TAG:-latest}
    pull_policy: missing
    build: ${METRIC_SERVICE_BUILD:-https://github.com/Hack-Challenges-recommendation-system/Metric-service.git#develop}
    restart: unless-stopped
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/metric
      DB_USERNAME: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      EVENTS_IMPORT_PATH: ${EVENTS_IMPORT_PATH:-file:/data/events.json}
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *java-healthcheck

  recommendation-service:
    image: ${DOCKERHUB_USER:-kekishev}/hackathon-recommendation-system-recommendation-service:${IMAGE_TAG:-latest}
    pull_policy: missing
    build: ${RECOMMENDATION_SERVICE_BUILD:-https://github.com/Hack-Challenges-recommendation-system/Recommedation-service.git#develop}
    restart: unless-stopped
    environment:
      <<: *java-env
    healthcheck: *java-healthcheck

  api-gateway:
    image: ${DOCKERHUB_USER:-kekishev}/hackathon-recommendation-system-api-gateway:${IMAGE_TAG:-latest}
    pull_policy: missing
    build: ${API_GATEWAY_BUILD:-https://github.com/Hack-Challenges-recommendation-system/API-gateway.git#develop}
    restart: unless-stopped
    environment:
      <<: *java-env
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-secret-change-it-for-any-real-deployment-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:[*],http://127.0.0.1,http://127.0.0.1:[*],https://cson.site}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck: *java-healthcheck

  frontend:
    image: ${DOCKERHUB_USER:-kekishev}/hackathon-recommendation-system-frontend:${IMAGE_TAG:-latest}
    pull_policy: missing
    build: ${FRONTEND_BUILD:-https://github.com/Hack-Challenges-recommendation-system/Frontend.git#develop}
    restart: unless-stopped
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  kafka_data:
